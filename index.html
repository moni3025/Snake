<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section id="front-page" class="section 1">
            <div class="Dashboard">
                <button id="start-btn">Start Game</button>
                <h3>Highest score:</h3>
                <h3>Game Level</h3>
            </div>

        </section>
        <section id="game-page" class="section 2">
            <div class="Gamescreen">
                <h1>Score:</h1>
                <h1>level:</h1>
            </div>
            <div id="score">Score : 0</div>
            <div id="game-board"></div>
        </section>
        <Section id="last-page" class="section3">
            <div class="over">
                <h1>Game Over</h1>
                <h3>Score</h3>
                <button id="restart-btn">Start Again</button>
            </div>
        </Section>
    </main>
    <script src="script.js"></script>
</body>
</html>
